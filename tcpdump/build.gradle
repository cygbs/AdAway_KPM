import com.android.build.gradle.internal.tasks.LibraryJniLibsTask

apply plugin: 'com.android.library'

def executableName = 'tcpdump'

android {
    compileSdk 33
    ndkVersion '27.2.12479018'
    namespace 'org.adaway.libpcap'

    defaultConfig {
        minSdkVersion 26
        targetSdk 33
    }

    sourceSets {
        main {
            // The generated directory holds the ndk-build executable renamed as a shared library
            // so it is packaged in the APK 'lib' folder (see packageExecutable below).
            jniLibs.srcDir layout.buildDirectory.dir('generated/executableJniLibs').get().asFile
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'jni/Android.mk'
        }
    }

    sonarqube {
        skipProject = true
    }
}

def buildFlavor = { gradle.startParameter.taskRequests.toString().containsIgnoreCase("debug") ? "debug" : "release" }

/**
 * ndk-build produces an executable (e.g. 'tcpdump'). Android only packages files named 'lib*.so'
 * shipped in the APK 'lib' folder, so copy the executable into a generated jniLibs directory
 * renamed as 'lib<name>_exec.so'.
 *
 * Doing the rename into a dedicated, generated jniLibs directory (instead of doing it in place in
 * the ndk-build output directory) makes the packaging deterministic: the previous in-place
 * approach relied on Android Gradle Plugin picking up the overwritten file, which failed on clean
 * builds and packaged the (empty) stub shared library instead of the real executable.
 */
def packageExecutable = tasks.register('packageExecutable', Copy) {
    def flavor = buildFlavor()
    def buildFolder = layout.buildDirectory.dir("intermediates/ndkBuild/${flavor}/obj/local")
    dependsOn ":${project.name}:externalNativeBuild${flavor.capitalize()}"
    from(buildFolder) {
        include "**/${executableName}"
        exclude "**/objs/**"
        exclude "**/objs-debug/**"
    }
    into layout.buildDirectory.dir('generated/executableJniLibs')
    rename '(.+)', 'lib$1_exec.so'
    includeEmptyDirs = false
}

tasks.withType(LibraryJniLibsTask).configureEach {
    dependsOn packageExecutable
}

// merge*JniLibFolders also reads the generated jniLibs directory, so it must wait for it too.
tasks.matching { it.name.toLowerCase().contains('jnilibfolders') }.configureEach {
    dependsOn packageExecutable
}
